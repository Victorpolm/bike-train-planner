name: Tariff expiry watch
# 2026-10-15: automatic expiry notifications paused at the owner's request.
# Manual checks remain available. Restore automatic triggers only when requested.
# Previous daily schedule: '15 6 * * *' (UTC).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail within 60 days of reviewed coverage expiry
        working-directory: prototype-v0
        run: node scripts/check-tariff-expiry.mjs
