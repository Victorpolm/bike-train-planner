name: Test and build

on:
  push:
    paths:
      - "prototype-v0/**"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "prototype-v0/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototype-v0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: prototype-v0/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:unused
      - run: npm test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node scripts/check-preferences-presentation.mjs
      - run: node scripts/check-facility-presentation.mjs
      - run: node scripts/check-continuity-presentation.mjs
      - run: npm run build
