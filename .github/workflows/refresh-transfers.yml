name: Refresh official station transfer data
on:
  schedule:
    - cron: '17 6 * * 2,5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-transfers.yml'
      - 'prototype-v0/scripts/refresh-station-transfers.py'
      - 'prototype-v0/scripts/import-station-transfers.py'
permissions:
  contents: write
concurrency:
  group: station-transfer-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 prototype-v0/scripts/refresh-station-transfers.py --output data/transfers
      - name: Save validated compact data
        run: |
          git add data/transfers
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh validated official station transfer indexes'
          git push origin HEAD:main
